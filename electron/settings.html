<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Cài đặt</title>
<style>
  :root {
    --background: #12141a;
    --surface: #1a1d24;
    --border: #2b2f38;
    --text-secondary: #8b93a1;
    --foreground: #edeff2;
    --accent: #38dfd8;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 28px 24px;
    -webkit-user-select: none;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.sub { color: var(--text-secondary); font-size: 12px; margin: 0 0 20px; line-height: 1.5; }
  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 9px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--foreground);
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  a { color: var(--accent); }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: var(--background);
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    margin-top: 12px;
    font-size: 12px;
    color: var(--danger);
    display: none;
  }
  .hint { font-size: 11px; color: var(--text-secondary); margin-top: 6px; }
</style>
</head>
<body>
  <h1>Cài đặt API key</h1>
  <p class="sub">
    Nhập API key Anthropic của bạn để bắt đầu dùng app. Key được lưu riêng trên máy
    này, không gửi đi đâu khác ngoài trực tiếp tới Claude API.
  </p>

  <label for="apiKey">Anthropic API key</label>
  <input id="apiKey" type="password" placeholder="sk-ant-..." autofocus />
  <p class="hint">Lấy tại platform.claude.com/settings/keys</p>

  <label for="workspaceId">Workspace ID (tùy chọn)</label>
  <input id="workspaceId" type="text" placeholder="wrkspc_..." />
  <p class="hint">Chỉ điền nếu lúc dùng bị báo lỗi "anthropic-workspace-id is required".</p>

  <div class="error" id="error"></div>
  <button id="saveBtn">Lưu và bắt đầu</button>

  <script>
    const saveBtn = document.getElementById('saveBtn');
    const apiKeyInput = document.getElementById('apiKey');
    const workspaceInput = document.getElementById('workspaceId');
    const errorEl = document.getElementById('error');

    window.electronAPI.getConfig().then((cfg) => {
      if (cfg?.apiKey) apiKeyInput.value = cfg.apiKey;
      if (cfg?.workspaceId) workspaceInput.value = cfg.workspaceId;
    });

    saveBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      errorEl.style.display = 'none';
      if (!apiKey.startsWith('sk-ant-')) {
        errorEl.textContent = 'API key không đúng định dạng (phải bắt đầu bằng sk-ant-).';
        errorEl.style.display = 'block';
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Đang khởi động...';
      try {
        await window.electronAPI.saveApiKey(apiKey, workspaceInput.value.trim());
      } catch (err) {
        errorEl.textContent = 'Lỗi: ' + err.message;
        errorEl.style.display = 'block';
        saveBtn.disabled = false;
        saveBtn.textContent = 'Lưu và bắt đầu';
      }
    });
  </script>
</body>
</html>
